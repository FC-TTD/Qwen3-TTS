[tool:pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=../qwen_tts
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
testpaths = .
markers =
    smoke: Smoke tests, verify basic functionality
    integration: Integration tests, require complete API service
    slow: Slow tests, involve heavy computation
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:soundfile.*
timeout = 300
timeout_method = thread
