---
- name: 在 ttd-edge 上部署 Qwen3-TTS（docker build + compose）
  hosts: ttd-edge
  gather_facts: yes
  vars:
    project_name: "qwen3-tts"
    project_path: "{{ playbook_dir }}/.."
    remote_project_path: "/opt/qwen3-tts"
    image_name: "qwen3-tts"
    image_tag: "latest"

    rsync_opts:
      - "--exclude=*/__pycache__"
      - "--exclude=*/.pytest_cache"
      - "--exclude=*/.git"
      - "--exclude=*.pyc"
      - "--include=docker/"
      - "--include=finetuning/"
      - "--include=qwen_tts/"
      - "--include=docker/Dockerfile"
      - "--include=docker/compose.yaml"
      - "--include=pyproject.toml"
      - "--include=README.md"
      - "--include=LICENSE"
      - "--include=app.py"
      - "--include=docker/**"
      - "--include=qwen_tts/**"
      - "--include=finetuning/**"
      - "--exclude=*"

  tasks:
    - name: 同步项目到 ttd-edge
      ansible.posix.synchronize:
        src: "{{ project_path }}/"
        dest: "{{ remote_project_path }}/"
        delete: false
        rsync_opts: "{{ rsync_opts }}"
      tags: [docker, ci, sync]

    - name: 在 ttd-edge 上构建 Docker 镜像
      ansible.builtin.command:
        cmd: "docker build -t {{ image_name }}:{{ image_tag }} -f docker/Dockerfile ."
        chdir: "{{ remote_project_path }}"
      tags: [docker, ci]

    - name: 使用 docker compose 启动服务
      ansible.builtin.command:
        cmd: "docker compose -f docker/compose.yaml up -d"
        chdir: "{{ remote_project_path }}"
      tags: [docker, cd]

- name: 部署 Qwen3-TTS Fusion Swarm 服务
  hosts: localhost
  gather_facts: yes
  vars:
    project_name: "qwen-tts-fusion"
    project_path: "{{ playbook_dir }}/.."
    compose_file: "{{ project_path }}/docker/stack.fusion.yml"
    dockerfile: "{{ project_path }}/docker/Dockerfile.fusion"
    image_name: "fusion"
    image_tag: "h-build-required"
    ci_buildkit_host: "ttd-nest"
    ci_buildx_builder_name: "qwen-fusion-consolidation"
    ci_probe_work_root: "/tmp/qwen-fusion-ci-20260912"
    ci_probe_generator_local_bin: "/tmp/qwen-fusion-ci-20260912/probe-generator"
    ci_publish_label_tag: false
    pt_force_recreate_stack: false
    build_host: "ttd-nest"
    ci_registry_url: "registry.ttd"

    rsync_opts:
      - "--exclude=*/__pycache__"
      - "--exclude=*/.pytest_cache"
      - "--exclude=*/.git"
      - "--exclude=*.pyc"
      - "--include=docker/"
      - "--include=docker/Dockerfile.fusion"
      - "--include=docker/stack.fusion.yml"
      - "--include=finetuning/"
      - "--include=finetuning/**"
      - "--include=fusion/"
      - "--include=fusion/**"
      - "--include=qwen_tts/"
      - "--include=qwen_tts/**"
      - "--include=pyproject.toml"
      - "--include=requirements.txt"
      - "--include=README.md"
      - "--include=LICENSE"
      - "--include=app.py"
      - "--exclude=*"

  tags: [swarm, fusion]

  roles:
    - role: docker_ci_cd
      vars:
        ci_project_name: "{{ project_name }}"
        ci_project_path: "{{ project_path }}"
        ci_dockerfile_path: "{{ dockerfile }}"
        ci_image_name: "{{ image_name }}"
        ci_image_tag: "{{ image_tag }}"
        ci_identity_provider: "probe"
        ci_compose_file_path: "{{ compose_file }}"
        ci_build_host: "{{ build_host }}"
        ci_rsync_opts: "{{ rsync_opts }}"
        pt_stack_name: "qwen-tts-fusion-single"
